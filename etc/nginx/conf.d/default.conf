# Server configuration for Whisper Transcriber
server {
    listen 80;
    server_name localhost;

    root /app/build;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
