# Server configuration for Whisper Transcriber
# Upstream backend (Whisper API server)
# In production pod: whisper-server shares the pod network namespace,
#   reachable at its container port 9000 via localhost.
# In development: direct connection to backend at localhost:8005.
upstream whisper_backend {
    # Inside a podman pod, containers share the network namespace.
    # Use the container's internal port (9000), not the hostPort (8005).
    server 127.0.0.1:9000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    root /app/build;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API transcription endpoint - proxies to Whisper backend
    location /v1/audio {
        proxy_pass http://whisper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint - proxies to backend for real health verification
    location /health {
        access_log off;
        proxy_pass http://whisper_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # Main application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
